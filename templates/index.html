<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixy - Assistant Domotique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: white;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        @keyframes ripple {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4), 0 0 0 0 rgba(56, 189, 248, 0.4); }
            80% { box-shadow: 0 0 0 30px rgba(56, 189, 248, 0), 0 0 0 60px rgba(56, 189, 248, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0), 0 0 0 0 rgba(56, 189, 248, 0); }
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .recording-active .mic-btn {
            animation: ripple 1.5s infinite linear;
            background: linear-gradient(135deg, #ef4444, #b91c1c) !important;
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.6) !important;
        }

        .recording-active .pulse-ring {
            animation: pulse-ring 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .sector-indicator {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sector-on {
            background-color: #22c55e;
            box-shadow: 0 0 15px 2px rgba(34, 197, 94, 0.5);
        }
        .sector-off {
            background-color: #ef4444;
            box-shadow: 0 0 10px 1px rgba(239, 68, 68, 0.3);
        }

        .disabled-control {
            opacity: 0.4;
            pointer-events: none;
            cursor: not-allowed;
            filter: grayscale(0.5);
            transition: all 0.3s ease;
        }

        .mic-btn:disabled {
            cursor: not-allowed;
            filter: grayscale(0.8);
            transform: scale(0.95);
        }

        .processing-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(2, 6, 23, 0.7);
            backdrop-filter: blur(4px);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: all;
        }

        /* Styles améliorés pour l'éditeur de durée */
        .duration-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: linear-gradient(to right, #0ea5e9, #3b82f6);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .duration-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: white;
            border: 3px solid #3b82f6;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            transition: all 0.2s ease;
        }

        .duration-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.8);
        }

        .duration-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: white;
            border: 3px solid #3b82f6;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        .time-preset {
            transition: all 0.2s ease;
        }

        .time-preset:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
        }

        .time-preset.active {
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            border-color: #60a5fa;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col selection:bg-sky-500/30">

    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-blue-900/20 blur-[120px]"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-sky-900/10 blur-[130px]"></div>
        <div class="absolute top-[40%] left-[30%] w-[30vw] h-[30vw] rounded-full bg-purple-900/10 blur-[100px]"></div>
    </div>

    <!-- Overlay de traitement -->
    <div id="processing-overlay" class="processing-overlay hidden">
        <div class="glass-panel p-8 rounded-3xl text-center max-w-md mx-4">
            <div class="relative w-20 h-20 mx-auto mb-6">
                <div class="absolute inset-0 rounded-full border-4 border-sky-400/30"></div>
                <div class="absolute inset-0 rounded-full border-4 border-transparent border-t-sky-400 animate-spin"></div>
                <svg class="absolute inset-4 w-12 h-12 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                </svg>
            </div>
            <h3 class="text-xl font-bold text-white mb-2">Analyse en cours</h3>
            <p class="text-gray-400 text-sm">Pixy traite votre commande vocale...</p>
        </div>
    </div>

    <div class="relative z-10 flex flex-col flex-grow max-w-6xl w-full mx-auto p-4 md:p-8">
        
        <header class="flex justify-between items-center mb-12 glass-panel px-6 py-4 rounded-2xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tight text-white">PIXY</h1>
                    <p class="text-xs text-sky-400 font-medium tracking-widest uppercase">Intelligence Domotique</p>
                </div>
            </div>
            
            <div id="system-status" class="flex items-center gap-2 bg-white/5 border border-white/10 px-4 py-2 rounded-full">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <span class="text-sm font-medium text-gray-300">Système Connecté</span>
            </div>
        </header>

        <main class="flex-grow flex flex-col items-center justify-center mb-12">
            
            <div class="h-12 mb-8 flex items-center justify-center text-center">
                <p id="status-text" class="text-gray-400 text-lg font-light transition-all duration-300">
                    Prêt à écouter. Appuyez sur le micro.
                </p>
                <p id="timer-text" class="hidden text-3xl font-bold text-sky-400 tracking-widest tabular-nums ml-4">
                    00:00
                </p>
            </div>

            <div class="relative flex flex-col items-center justify-center mb-10" id="mic-container">
                <div class="absolute inset-0 rounded-full border border-white/5 scale-[1.3] z-0 pulse-ring"></div>
                <div class="absolute inset-0 rounded-full border border-white/10 scale-[1.15] z-0"></div>
                
                <button type="button" id="Launch" class="mic-btn relative z-10 w-32 h-32 md:w-40 md:h-40 rounded-full bg-gradient-to-br from-gray-800 to-gray-900 border border-gray-700 shadow-2xl flex items-center justify-center transition-all duration-300 hover:scale-105 active:scale-95 group">
                    <div class="absolute inset-2 rounded-full bg-gradient-to-br from-sky-500 to-blue-700 opacity-80 group-hover:opacity-100 transition-opacity"></div>
                    <svg id="mic-icon" class="relative z-20 w-12 h-12 md:w-16 md:h-16 text-white drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                    </svg>
                </button>
                
                <div id="recording-indicator" class="hidden mt-6 flex items-center gap-2">
                    <span class="flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-2 w-2 rounded-full bg-red-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                    </span>
                    <span class="text-xs text-red-400 font-medium">Enregistrement en cours...</span>
                </div>
            </div>

            <!-- NOUVEAU CONTRÔLE DE DURÉE AMÉLIORÉ -->
            <div class="glass-panel p-6 rounded-2xl w-full max-w-md" id="duration-control">
                <div class="flex items-center justify-between mb-4">
                    <label class="text-sm text-gray-400 font-medium">Durée d'écoute</label>
                    <div class="flex items-center gap-2">
                        <span id="duration-display" class="text-2xl font-bold text-white tabular-nums">5</span>
                        <span class="text-sm text-gray-400">secondes</span>
                    </div>
                </div>
                
                <!-- Slider pour ajuster la durée -->
                <div class="relative mb-4">
                    <input type="range" id="duration-slider" min="1" max="60" value="5" 
                           class="duration-slider w-full"
                           oninput="updateDuration(this.value)">
                    <div class="flex justify-between text-xs text-gray-500 mt-2">
                        <span>1s</span>
                        <span>15s</span>
                        <span>30s</span>
                        <span>45s</span>
                        <span>60s</span>
                    </div>
                </div>

                <!-- Boutons de préréglages rapides -->
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setDuration(3)" class="time-preset px-3 py-2 rounded-lg bg-gray-800/50 border border-gray-700 text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700 transition-all">
                        3s
                    </button>
                    <button onclick="setDuration(5)" class="time-preset active px-3 py-2 rounded-lg bg-gray-800/50 border border-gray-700 text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700 transition-all">
                        5s
                    </button>
                    <button onclick="setDuration(10)" class="time-preset px-3 py-2 rounded-lg bg-gray-800/50 border border-gray-700 text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700 transition-all">
                        10s
                    </button>
                    <button onclick="setDuration(15)" class="time-preset px-3 py-2 rounded-lg bg-gray-800/50 border border-gray-700 text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700 transition-all">
                        15s
                    </button>
                </div>

                <!-- Champ numérique caché pour la compatibilité -->
                <input type="hidden" name="nbr_sec" id="nbr_sec" value="5" min="1" max="60">
            </div>

        </main>

        <section class="grid grid-cols-1 md:grid-cols-4 gap-4 mt-auto">
            <div class="glass-panel p-5 rounded-2xl flex flex-row md:flex-col items-center justify-between md:justify-center gap-4 hover:bg-white/[0.05] transition-colors cursor-default group">
                <div class="flex items-center gap-3 md:flex-col">
                    <div class="w-12 h-12 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center group-hover:border-sky-500/30 transition-colors">
                        <svg class="w-5 h-5 text-gray-400 group-hover:text-sky-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                    </div>
                    <span class="font-semibold text-gray-200 group-hover:text-white transition-colors">Secteur 1</span>
                </div>
                <div id="status-s1" class="sector-indicator sector-off w-4 h-4 rounded-full shadow-lg"></div>
            </div>

            <div class="glass-panel p-5 rounded-2xl flex flex-row md:flex-col items-center justify-between md:justify-center gap-4 hover:bg-white/[0.05] transition-colors cursor-default group">
                <div class="flex items-center gap-3 md:flex-col">
                    <div class="w-12 h-12 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center group-hover:border-sky-500/30 transition-colors">
                        <svg class="w-5 h-5 text-gray-400 group-hover:text-sky-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                    </div>
                    <span class="font-semibold text-gray-200 group-hover:text-white transition-colors">Secteur 2</span>
                </div>
                <div id="status-s2" class="sector-indicator sector-off w-4 h-4 rounded-full shadow-lg"></div>
            </div>

            <div class="glass-panel p-5 rounded-2xl flex flex-row md:flex-col items-center justify-between md:justify-center gap-4 hover:bg-white/[0.05] transition-colors cursor-default group">
                <div class="flex items-center gap-3 md:flex-col">
                    <div class="w-12 h-12 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center group-hover:border-sky-500/30 transition-colors">
                        <svg class="w-5 h-5 text-gray-400 group-hover:text-sky-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                    </div>
                    <span class="font-semibold text-gray-200 group-hover:text-white transition-colors">Secteur 3</span>
                </div>
                <div id="status-s3" class="sector-indicator sector-off w-4 h-4 rounded-full shadow-lg"></div>
            </div>

            <div class="glass-panel p-5 rounded-2xl flex flex-row md:flex-col items-center justify-between md:justify-center gap-4 hover:bg-white/[0.05] transition-colors cursor-default group">
                <div class="flex items-center gap-3 md:flex-col">
                    <div class="w-12 h-12 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center group-hover:border-sky-500/30 transition-colors">
                        <svg class="w-5 h-5 text-gray-400 group-hover:text-sky-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                    </div>
                    <span class="font-semibold text-gray-200 group-hover:text-white transition-colors">Secteur 4</span>
                </div>
                <div id="status-s4" class="sector-indicator sector-off w-4 h-4 rounded-full shadow-lg"></div>
            </div>
        </section>
    </div>

    <script>
        // --- GESTION ENREGISTREMENT AUDIO ---
        let recorder;
        let chunks = [];
        let isProcessing = false;

        // --- NOUVELLES FONCTIONS POUR LE CONTRÔLE DE DURÉE ---
        function updateDuration(value) {
            value = parseInt(value);
            document.getElementById('duration-display').textContent = value;
            document.getElementById('nbr_sec').value = value;
            
            // Mettre à jour l'état actif des préréglages
            document.querySelectorAll('.time-preset').forEach(btn => {
                btn.classList.remove('active');
                if (parseInt(btn.textContent) === value) {
                    btn.classList.add('active');
                }
            });
        }

        function setDuration(seconds) {
            if (isProcessing) return;
            
            document.getElementById('duration-slider').value = seconds;
            updateDuration(seconds);
            
            // Animation de feedback
            const display = document.getElementById('duration-display');
            display.style.transform = 'scale(1.2)';
            setTimeout(() => {
                display.style.transform = 'scale(1)';
            }, 200);
        }

        // --- PROTECTION CONTRE LES MODIFICATIONS ---
        function disableControls() {
            isProcessing = true;
            const launchBtn = document.getElementById('Launch');
            const durationSlider = document.getElementById('duration-slider');
            const durationControl = document.getElementById('duration-control');
            const timePresets = document.querySelectorAll('.time-preset');
            
            launchBtn.disabled = true;
            durationSlider.disabled = true;
            durationControl.classList.add('disabled-control');
            launchBtn.classList.add('disabled-control');
            
            timePresets.forEach(btn => {
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.5';
            });
        }

        function enableControls() {
            isProcessing = false;
            const launchBtn = document.getElementById('Launch');
            const durationSlider = document.getElementById('duration-slider');
            const durationControl = document.getElementById('duration-control');
            const timePresets = document.querySelectorAll('.time-preset');
            
            launchBtn.disabled = false;
            durationSlider.disabled = false;
            durationControl.classList.remove('disabled-control');
            launchBtn.classList.remove('disabled-control');
            
            timePresets.forEach(btn => {
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
            });
        }

        function showProcessingOverlay() {
            document.getElementById('processing-overlay').classList.remove('hidden');
        }

        function hideProcessingOverlay() {
            document.getElementById('processing-overlay').classList.add('hidden');
        }

        async function startRecording() {
            if (isProcessing) return;
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recorder = new MediaRecorder(stream);

                recorder.ondataavailable = e => {
                    chunks.push(e.data);
                };

                recorder.start();
                disableControls();
            } catch (err) {
                console.error("Erreur d'accès au microphone :", err);
                alert("Impossible d'accéder au microphone.");
                resetUI();
                enableControls();
            }
        }

        function stopRecording() {
            if (!recorder || recorder.state === "inactive") return;

            recorder.onstop = async () => {
                const blob = new Blob(chunks, { type: recorder.mimeType });
                const formData = new FormData();
                formData.append("audio", blob, "audio.webm");

                document.getElementById('status-text').innerText = "Analyse IA en cours...";
                document.getElementById('status-text').className = "text-sky-400 text-lg font-medium animate-pulse";
                document.getElementById('timer-text').classList.add('hidden');
                document.getElementById('recording-indicator').classList.add('hidden');
                
                showProcessingOverlay();

                try {
                    const response = await fetch("/upload", {
                        method: "POST",
                        body: formData
                    });

                    // Actualiser l'état des secteurs après l'envoi
                    await fetchSectorStatus();

                    chunks = [];
                    alert("Opération effectuée avec succès !");
                    fetchSectorStatus();
                    resetUI();
                    enableControls();
                    hideProcessingOverlay();

                } catch (error) {
                    console.error("Erreur lors de l'envoi :", error);
                    alert("Erreur de connexion au serveur.");
                    resetUI();
                    enableControls();
                    hideProcessingOverlay();
                }
            };

            recorder.stop();
        }

        // --- UI ENREGISTREMENT ---
        let timerInterval;

        function Apply(seconds) {
            if (isProcessing) return;
            
            startRecording();

            const micContainer = document.getElementById('mic-container');
            const statusText = document.getElementById('status-text');
            const timerText = document.getElementById('timer-text');
            const recordingIndicator = document.getElementById('recording-indicator');
            const micIcon = document.getElementById('mic-icon');
            
            micContainer.classList.add('recording-active');
            statusText.innerText = "Écoute en cours...";
            statusText.className = "text-red-400 text-lg font-medium animate-pulse";
            timerText.classList.remove('hidden');
            recordingIndicator.classList.remove('hidden');
            
            // Changer l'icône du micro pour indiquer l'enregistrement
            micIcon.innerHTML = '<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="none"></circle><rect x="10" y="10" width="4" height="4" fill="currentColor"></rect>';

            let timeLeft = seconds;
            timerText.innerText = `00:${timeLeft.toString().padStart(2, '0')}`;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft >= 0) {
                    timerText.innerText = `00:${timeLeft.toString().padStart(2, '0')}`;
                }
                
                // Effet de pulsation sur le timer quand il reste moins de 3 secondes
                if (timeLeft <= 3 && timeLeft > 0) {
                    timerText.classList.add('animate-pulse');
                }
            }, 1000);

            setTimeout(() => {
                clearInterval(timerInterval);
                micContainer.classList.remove('recording-active');
                recordingIndicator.classList.add('hidden');
                
                // Restaurer l'icône du micro
                micIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>';
                
                stopRecording();
            }, seconds * 1000);
        }

        function resetUI() {
            document.getElementById('status-text').innerText = "Prêt à écouter. Appuyez sur le micro.";
            document.getElementById('status-text').className = "text-gray-400 text-lg font-light transition-all duration-300";
            document.getElementById('timer-text').classList.add('hidden');
            document.getElementById('timer-text').classList.remove('animate-pulse');
            document.getElementById('mic-container').classList.remove('recording-active');
            document.getElementById('recording-indicator').classList.add('hidden');
            clearInterval(timerInterval);
        }

        document.getElementById("Launch").onclick = () => {
            if (isProcessing) return;
            
            if (!document.getElementById('mic-container').classList.contains('recording-active')) {
                let nbr = parseInt(document.getElementById("nbr_sec").value);
                if(nbr > 0) {
                    Apply(nbr);
                } else {
                    alert("Veuillez entrer une durée valide.");
                }
            }
        };

        // --- GESTION STATUT DES SECTEURS (depuis /stat) ---
        async function fetchSectorStatus() {
            try {
                const response = await fetch('/stat');
                const data = await response.json(); // ex: [["Secteur1","ON1",1],["Secteur2","ON2",0],...]

                data.forEach(item => {
                    const secteurName = item[0];   // "Secteur1"
                    const statusValue = item[2];    // 1 ou 0

                    // Mapping inversé : 1 = éteint, 0 = allumé
                    const isOn = (statusValue === 0);

                    // Extraire le numéro du secteur (ex: "Secteur1" -> "1")
                    const num = secteurName.replace('Secteur', '');
                    const elementId = 'status-s' + num;
                    const el = document.getElementById(elementId);

                    if (el) {
                        if (isOn) {
                            el.className = 'sector-indicator sector-on w-4 h-4 rounded-full shadow-lg';
                        } else {
                            el.className = 'sector-indicator sector-off w-4 h-4 rounded-full shadow-lg';
                        }
                    }
                });
            } catch (error) {
                console.error('Erreur récupération statut secteurs:', error);
            }
        }

        // Empêcher la modification manuelle pendant le traitement
        document.getElementById('duration-slider').addEventListener('input', function(e) {
            if (isProcessing) {
                e.preventDefault();
                this.value = document.getElementById('nbr_sec').value;
            }
        });

        // Rafraîchissement initial et périodique (toutes les 5 secondes)
        document.addEventListener('DOMContentLoaded', () => {
            fetchSectorStatus();
            // Initialiser l'affichage de la durée
            updateDuration(5);
        });
    </script>
</body>
</html>
